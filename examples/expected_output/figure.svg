<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" font-family="sans-serif">
<title>Synthetic overview: stimulus reaches the recorder through one relay</title>
<desc>Example scene used to show the interface; not a result for any official case.</desc>
<rect id="canvas-bg" x="0" y="0" width="1400" height="820" fill="#ffffff"/>
<g id="layer-frame">
</g>
<g id="layer-connectors">
<g id="edge-e-1">
<line x1="310" y1="355" x2="380" y2="355" stroke="#333333" stroke-width="2" fill="none"/>
<polygon points="380,355 369.124,360.071 369.124,349.929" fill="#333333"/>
<text id="edge-label-e-1" x="345" y="347" font-size="14" fill="#222222" text-anchor="middle">excites</text>
</g>
<g id="edge-e-2">
<line x1="620" y1="355" x2="700" y2="355" stroke="#333333" stroke-width="2" fill="none"/>
<polygon points="700,355 689.124,360.071 689.124,349.929" fill="#333333"/>
<text id="edge-label-e-2" x="660" y="347" font-size="14" fill="#222222" text-anchor="middle">projects to</text>
</g>
<g id="edge-e-3">
<line x1="500" y1="540" x2="500" y2="410" stroke="#333333" stroke-width="2" fill="none" stroke-dasharray="8,6"/>
<polygon points="500,410 505.071,420.876 494.929,420.876" fill="#333333"/>
<text id="edge-label-e-3" x="500" y="467" font-size="14" fill="#222222" text-anchor="middle">inhibits</text>
</g>
</g>
<g id="layer-shapes">
<g id="node-n-stim" data-source-kind="stated">
<rect x="70" y="300" width="240" height="110" rx="12" fill="#dbe7f5" stroke="#2b4a6f" stroke-width="2"/>
</g>
<g id="node-n-relay" data-source-kind="stated">
<rect x="380" y="300" width="240" height="110" fill="#e8f2e0" stroke="#3f6b34" stroke-width="2"/>
</g>
<g id="node-n-rec" data-source-kind="stated">
<ellipse cx="830" cy="355" rx="130" ry="70" fill="#f5e6db" stroke="#6f4a2b" stroke-width="2"/>
</g>
<g id="node-n-ctrl" data-source-kind="inferred">
<polygon points="500,540 600,600 500,660 400,600" fill="#f0f0f0" stroke="#555555" stroke-width="2"/>
</g>
</g>
<g id="layer-labels">
<text id="label-n-stim-0" x="190" y="361" font-size="20" fill="#111111" text-anchor="middle">stimulus</text>
<text id="label-n-relay-0" x="500" y="361" font-size="20" fill="#111111" text-anchor="middle">relay nucleus</text>
<text id="label-n-rec-0" x="830" y="361" font-size="20" fill="#111111" text-anchor="middle">recorder</text>
<text id="label-n-ctrl-0" x="500" y="605.4" font-size="18" fill="#111111" text-anchor="middle">control arm</text>
<g id="legend">
<rect x="1140" y="24" width="18" height="18" fill="#dbe7f5" stroke="#333"/>
<text x="1166" y="38" font-size="15" fill="#111">stated in the text</text>
<rect x="1140" y="50" width="18" height="18" fill="#f0f0f0" stroke="#333"/>
<text x="1166" y="64" font-size="15" fill="#111">inferred, needs confirmation</text>
</g>
<text id="annotation-0" x="70" y="70" font-size="18" fill="#333">A synthetic example, not an official case result</text>
</g>
</svg>